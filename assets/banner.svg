<!-- HalluScribe — README banner. Self-contained dark card so it renders in GitHub light & dark themes. -->
<svg width="760" height="220" viewBox="0 0 760 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HalluScribe — local-first AI session archive">
  <!-- dark card so text stays legible in both GitHub themes -->
  <rect x="2" y="2" width="756" height="216" rx="28" fill="#111827" stroke="#1f2937" stroke-width="4"/>

  <!-- logo mark (reused from logo.svg) -->
  <g transform="translate(46,38) scale(0.56)">
    <rect x="20" y="20" width="216" height="216" rx="40" fill="#1f2937" stroke="#374151" stroke-width="4"/>
    <path d="M72 94 L110 128 L72 162" fill="none" stroke="#f59e0b" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="128" y="100" width="78" height="12" rx="6" fill="#6b7280"/>
    <rect x="128" y="122" width="62" height="12" rx="6" fill="#6b7280"/>
    <rect x="128" y="148" width="36" height="14" rx="7" fill="#f59e0b"/>
  </g>

  <!-- wordmark -->
  <text x="232" y="118" font-family="'Courier New', Courier, monospace" font-size="58" font-weight="700" letter-spacing="-1">
    <tspan fill="#f9fafb">Hallu</tspan><tspan fill="#f59e0b">Scribe</tspan>
  </text>
  <!-- tagline -->
  <text x="234" y="158" font-family="'Courier New', Courier, monospace" font-size="22" fill="#6b7280">Local-first AI session archive</text>
</svg>
