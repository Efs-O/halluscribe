<!-- HalluScribe — logo mark. HalluMeter palette: dark surface, amber accent, monospace prompt. -->
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HalluScribe">
  <!-- page / terminal card -->
  <rect x="20" y="20" width="216" height="216" rx="40" fill="#1f2937" stroke="#374151" stroke-width="4"/>
  <!-- prompt chevron: reading the session -->
  <path d="M72 94 L110 128 L72 162" fill="none" stroke="#f59e0b" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- session lines being read (muted) -->
  <rect x="128" y="100" width="78" height="12" rx="6" fill="#6b7280"/>
  <rect x="128" y="122" width="62" height="12" rx="6" fill="#6b7280"/>
  <!-- summary cursor being written (amber) -->
  <rect x="128" y="148" width="36" height="14" rx="7" fill="#f59e0b"/>
</svg>
